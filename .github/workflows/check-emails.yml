name: Check LaPoste Emails
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm init -y && npm install puppeteer
      - name: Scrape
        run: node scraper.js
        env:
          LAPOSTE_EMAIL: ${{ secrets.LAPOSTE_EMAIL }}
          LAPOSTE_PASSWORD: ${{ secrets.LAPOSTE_PASSWORD }}
      - name: Commit
        run: |
          git config user.name 'Email Bot'
          git config user.email 'bot@users.noreply.github.com'
          git add screenshot.png latest_5.json debug_page.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "📬 Update emails" && git push)
