name: Check LaPoste Emails

on:
  schedule:
    - cron: '*/10 * * * *'  # Toutes les 10 minutes
  workflow_dispatch:  # Permet le lancement manuel

jobs:
  scrape-emails:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          npm init -y
          npm install puppeteer
      
      - name: Scrape emails from LaPoste
        run: node scraper.js
        env:
          LAPOSTE_EMAIL: ${{ secrets.LAPOSTE_EMAIL }}
          LAPOSTE_PASSWORD: ${{ secrets.LAPOSTE_PASSWORD }}
      
      - name: Update emails.json
        run: |
          git config --global user.name '📧 Email Bot'
          git config --global user.email 'email-bot@users.noreply.github.com'
          git add emails.json
          git diff --quiet && git diff --staged --quiet || git commit -m "📬 Update emails - $(date +'%Y-%m-%d %H:%M')"
          git push
