<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="600">
    <title>📧 Dashboard LaPoste.net</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .header-title { display: flex; align-items: center; gap: 1rem; }
        .header-title h1 {
            font-size: 2rem; font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--success); animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100%{opacity:1;} 50%{opacity:0.5;}
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .stat-card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            border-radius: 1rem; padding: 1.5rem; transition: all 0.3s ease;
        }
        .stat-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .stat-value { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .stat-label { color: var(--text-secondary); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }

        .search-container { margin-bottom: 1.5rem; }
        .search-input {
            width: 100%; padding: 1rem 1.5rem; background: var(--bg-secondary);
            border: 1px solid var(--border); border-radius: 1rem;
            color: var(--text-primary); font-size: 1rem; transition: all 0.3s ease;
        }
        .search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .search-input::placeholder { color: var(--text-secondary); }

        /* Screenshot */
        .screenshot-section {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 1rem; padding: 1rem; margin-bottom: 1.5rem;
        }
        .screenshot-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; font-weight: 500; }
        .screenshot-img { width: 100%; max-height: 400px; object-fit: contain; border-radius: 0.5rem; border: 1px solid var(--border); display: block; }
        .screenshot-controls { margin-top: 0.5rem; display: flex; gap: 0.5rem; justify-content: flex-end; }
        .screenshot-btn { background: var(--accent); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem; }
        .screenshot-btn:hover { background: var(--accent-hover); }

        /* Email list */
        .email-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .email-item {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 1rem; padding: 1.25rem; transition: all 0.3s ease;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .email-item:hover { border-color: var(--accent); transform: translateX(4px); box-shadow: 0 4px 12px rgba(59,130,246,0.1); }
        .email-item.unread { border-left: 4px solid var(--accent); background: linear-gradient(90deg, rgba(59,130,246,0.05) 0%, var(--bg-secondary) 100%); }
        .email-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
        .email-subject { font-weight: 600; font-size: 1.1rem; flex: 1; margin-right: 1rem; }
        .email-badges { display: flex; gap: 0.5rem; flex-shrink: 0; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .badge-new { background: var(--accent); color: white; }
        .badge-date { background: rgba(255,255,255,0.1); color: var(--text-secondary); }
        .email-from { color: var(--accent); font-weight: 500; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .email-preview { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .loading-state, .empty-state, .error-state { text-align: center; padding: 4rem 2rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 1.5rem; }
        .loading-spinner { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer { text-align: center; margin-top: 2rem; color: var(--text-secondary); font-size: 0.875rem; }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header { padding: 1.5rem; }
            .header-title h1 { font-size: 1.5rem; }
            .stat-value { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <div class="header-title">
                    <span class="status-dot"></span>
                    <h1>Dashboard LaPoste.net</h1>
                </div>
                <span id="connectionStatus" style="color: var(--text-secondary); font-size: 0.9rem;">Connexion...</span>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="totalEmails" style="color: var(--accent);">--</div><div class="stat-label">Total Emails</div></div>
                <div class="stat-card"><div class="stat-value" id="unreadEmails" style="color: var(--warning);">--</div><div class="stat-label">Non Lus</div></div>
                <div class="stat-card"><div class="stat-value" id="readEmails" style="color: var(--success);">--</div><div class="stat-label">Lus</div></div>
                <div class="stat-card"><div class="stat-value" id="lastUpdate" style="color: var(--text-secondary); font-size: 1.2rem;">--</div><div class="stat-label">Dernière MàJ</div></div>
            </div>
        </header>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="🔍 Rechercher par sujet, expéditeur ou contenu..." oninput="filterEmails(this.value)">
        </div>

        <div class="screenshot-section">
            <div class="screenshot-header">📸 Aperçu de la boîte mail (zone des emails)</div>
            <img id="screenshotImg" class="screenshot-img" src="screenshot.png" alt="Capture emails" onerror="this.style.display='none'">
            <div class="screenshot-controls">
                <button class="screenshot-btn" onclick="refreshScreenshot()">🔄 Actualiser l'image</button>
            </div>
        </div>

        <div id="emailContainer">
            <div class="loading-state"><div class="loading-spinner"></div><p>Chargement de vos emails...</p></div>
        </div>

        <div class="footer">
            <p>🔄 Mise à jour automatique toutes les 15 minutes</p>
            <p>🔒 Consultation en lecture seule - Aucune modification possible</p>
        </div>
    </div>

    <script>
        let allEmails = [];

        async function loadEmails() {
            const container = document.getElementById('emailContainer');
            const connectionStatus = document.getElementById('connectionStatus');
            try {
                const response = await fetch(`emails.json?t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                allEmails = data.emails || [];
                connectionStatus.innerHTML = '✅ Connecté';
                connectionStatus.style.color = 'var(--success)';
                displayEmails(allEmails);
                updateStats(allEmails, data.lastUpdate);
                refreshScreenshot();
            } catch (error) {
                container.innerHTML = `<div class="error-state"><div class="error-icon">⚠️</div><h3>Impossible de charger les emails</h3><p>${error.message}</p><p>Utilisez l'aperçu ci-dessus.</p></div>`;
                connectionStatus.innerHTML = '❌ Erreur';
                connectionStatus.style.color = 'var(--danger)';
            }
        }

        function displayEmails(emails) {
            const container = document.getElementById('emailContainer');
            if (!emails || emails.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><h3>Aucun email extrait</h3><p>Consultez l'aperçu visuel en attendant.</p></div>`;
                return;
            }
            container.innerHTML = emails.map(email => `
                <div class="email-item ${email.isUnread ? 'unread' : ''}" onclick="showEmailDetail('${escapeHtml(email.subject)}','${escapeHtml(email.from)}','${escapeHtml(email.date)}','${escapeHtml(email.preview)}')" data-search="${escapeHtml(email.subject)} ${escapeHtml(email.from)} ${escapeHtml(email.preview)}">
                    <div class="email-header">
                        <div class="email-subject">${escapeHtml(email.subject)}</div>
                        <div class="email-badges">
                            ${email.isUnread ? '<span class="badge badge-new">Nouveau</span>' : ''}
                            <span class="badge badge-date">${escapeHtml(email.date)}</span>
                        </div>
                    </div>
                    <div class="email-from">📨 ${escapeHtml(email.from)}</div>
                    <div class="email-preview">${escapeHtml(email.preview)}</div>
                </div>
            `).join('');
        }

        function updateStats(emails, lastUpdate) {
            const total = emails.length;
            const unread = emails.filter(e => e.isUnread).length;
            document.getElementById('totalEmails').textContent = total;
            document.getElementById('unreadEmails').textContent = unread;
            document.getElementById('readEmails').textContent = total - unread;
            if (lastUpdate) {
                const date = new Date(lastUpdate);
                document.getElementById('lastUpdate').textContent = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            }
        }

        function filterEmails(searchTerm) {
            const items = document.querySelectorAll('.email-item');
            const term = searchTerm.toLowerCase();
            items.forEach(item => {
                const searchData = item.getAttribute('data-search').toLowerCase();
                item.style.display = term === '' || searchData.includes(term) ? '' : 'none';
            });
        }

        function showEmailDetail(subject, from, date, preview) {
            alert(`📧 ${subject}\n\n👤 ${from}\n📅 ${date}\n\n📝 ${preview}`);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function refreshScreenshot() {
            const img = document.getElementById('screenshotImg');
            if (img) {
                img.src = `screenshot.png?t=${Date.now()}`;
                img.style.display = 'block';
            }
        }

        loadEmails();
        refreshScreenshot();
        setInterval(loadEmails, 600000);
        setInterval(refreshScreenshot, 600000);
    </script>
</body>
</html>
